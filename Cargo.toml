[package]
name = "langtype"
version = "1.0.0"
edition = "2021"
description = "Bilingual EN/RU typing trainer"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rand = "0.8"
quick-xml = { version = "0.37", features = ["encoding"] }
zip = "2"
